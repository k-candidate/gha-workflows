name: docker-bake

on:
  workflow_call:
    inputs:
      bake-file:
        description: 'Bake HCL file path'
        type: string
        default: './docker-bake.hcl'
      group:
        description: 'Bake group to build'
        type: string
        default: 'default'
      version:
        description: 'Version string to expose as VERSION env var for bake variable interpolation (e.g. for tagging from a release)'
        type: string
        required: false
      runner-amd64:
        description: 'Runner to use for amd64 builds'
        type: string
        default: 'ubuntu-latest'
      runner-arm64:
        description: 'Runner to use for arm64 builds'
        type: string
        default: 'ubuntu-24.04-arm'
    secrets:
      dockerhub_username:
        description: 'DockerHub username'
        required: true
      dockerhub_token:
        description: 'DockerHub token'
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      targets_json: ${{ steps.parse.outputs.targets_json }}
      needs_merge: ${{ steps.parse.outputs.needs_merge }}
      instance_id: ${{ steps.parse.outputs.instance_id }}
      managed_annotations_json: ${{ steps.annotations.outputs.annotations_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute OCI annotations
        id: annotations
        env:
          GH_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          IMAGE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # Compute the 4 standard OCI annotations from GitHub context
          CREATED_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          ANNOTATIONS=$(jq -cn \
            --arg created "$CREATED_TIME" \
            --arg source "$GH_REPO_URL" \
            --arg version "$IMAGE_VERSION" \
            --arg revision "$GH_SHA" \
            '{"org.opencontainers.image.created": $created,
              "org.opencontainers.image.source": $source,
              "org.opencontainers.image.version": $version,
              "org.opencontainers.image.revision": $revision}')
          
          echo "annotations_json=$(echo "$ANNOTATIONS" | jq -c .)" >> $GITHUB_OUTPUT
          
          echo "=== OCI Annotations (workflow-managed) ==="
          echo "$ANNOTATIONS" | jq .

      - name: Parse bake file and build matrix and target info
        id: parse
        env:
          VERSION: ${{ inputs.version }}
          MANAGED_ANNOTATIONS: ${{ steps.annotations.outputs.annotations_json }}
        run: |
          # Unique ID to namespace artifacts when multiple caller jobs invoke this workflow in one run
          INSTANCE_ID=$(head -c 4 /dev/urandom | xxd -p)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

          BAKE_JSON=$(docker buildx bake --file ${{ inputs.bake-file }} --print ${{ inputs.group }})
          TARGET_NAMES=$(echo "$BAKE_JSON" | jq -r --arg group '${{ inputs.group }}' '.group[$group].targets[]')

          MATRIX_ITEMS='[]'
          TARGETS_INFO='{}'

          for TARGET in $TARGET_NAMES; do
            PLATFORMS=$(echo "$BAKE_JSON" | jq -r --arg target "$TARGET" '.target[$target].platforms[]?')

            if [ -z "$PLATFORMS" ]; then
              echo "Warning: Target $TARGET has no platforms, skipping"
              continue
            fi

            # Build matrix entries for this target
            for PLATFORM in $PLATFORMS; do
              MATRIX_ITEMS=$(echo "$MATRIX_ITEMS" | jq -c --arg target "$TARGET" --arg platform "$PLATFORM" \
                '. += [{"target": $target, "platform": $platform}]')
            done

            # Build targets info entry for this target
            TAGS=$(echo "$BAKE_JSON" | jq -c --arg target "$TARGET" \
              '[.target[$target].tags[]? | select(test("^[a-zA-Z0-9-._/]+@[a-f0-9]{64}$") | not)]')
            PLATFORMS_JSON=$(echo "$BAKE_JSON" | jq -c --arg target "$TARGET" \
              '[.target[$target].platforms[]?]')
            # Bake uses key=value strings for annotations. Preserve every caller
            # annotation, then overwrite only the workflow-managed OCI keys.
            CALLER_ANNOTATIONS=$(echo "$BAKE_JSON" | jq -c --arg target "$TARGET" '
              [.target[$target].annotations[]? | capture("^(?<key>[^=]+)=(?<value>.*)$")]
              | reduce .[] as $annotation ({}; .[$annotation.key] = $annotation.value)')
            EFFECTIVE_ANNOTATIONS=$(jq -cn \
              --argjson caller "$CALLER_ANNOTATIONS" \
              --argjson managed "$MANAGED_ANNOTATIONS" \
              '$caller + $managed')
            TARGETS_INFO=$(echo "$TARGETS_INFO" | jq -c \
              --arg target "$TARGET" \
              --argjson tags "$TAGS" \
              --argjson platforms "$PLATFORMS_JSON" \
              --argjson annotations "$EFFECTIVE_ANNOTATIONS" \
              '.[$target] = {"tags": $tags, "platforms": $platforms, "annotations": $annotations}')
          done

          echo "matrix=$MATRIX_ITEMS" >> $GITHUB_OUTPUT
          echo "targets_json=$TARGETS_INFO" >> $GITHUB_OUTPUT

          # needs_merge is true only if any target has more than one platform
          NEEDS_MERGE=$(echo "$TARGETS_INFO" | jq '[.[].platforms | length] | any(. > 1)')
          echo "needs_merge=$NEEDS_MERGE" >> $GITHUB_OUTPUT

          echo "=== Build Matrix ==="
          echo "$MATRIX_ITEMS" | jq .
          echo "=== Targets Info ==="
          echo "$TARGETS_INFO" | jq .

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && inputs.runner-arm64 || inputs.runner-amd64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Discover and export inherited build secrets
        env:
          ALL_INHERITED_SECRETS: ${{ toJSON(secrets) }}
          BAKE_FILE: ${{ inputs.bake-file }}
          BAKE_GROUP: ${{ inputs.group }}
        run: |
          set -euo pipefail

          BAKE_JSON=$(docker buildx bake --file "$BAKE_FILE" --print "$BAKE_GROUP")

          BAD_SECRET_NAMES=$(echo "$BAKE_JSON" | jq -r '
            .target
            | to_entries[]
            | .value.secret[]?
            | select(type == "object")
            | select((.id // empty) != "" and (.env // empty) != "" and (.id != .env))
            | "id=\(.id) env=\(.env)"' || true)

          if [ -n "$BAD_SECRET_NAMES" ]; then
            echo "ERROR: Every bake secret id must match its env name. Found mismatches:"
            printf '%s\n' "$BAD_SECRET_NAMES"
            exit 1
          fi

          SECRET_NAMES=$(echo "$BAKE_JSON" | jq -r '
            .target
            | to_entries[]
            | .value.secret[]?
            | if type == "object" then (.id // .env // empty) else . end
            | select(length > 0)
          ' | sort -u)

          if [ -z "$SECRET_NAMES" ]; then
            echo "No build secrets referenced by the bake file for group $BAKE_GROUP."
            exit 0
          fi

          while IFS= read -r SECRET_NAME; do
            [ -n "$SECRET_NAME" ] || continue

            SECRET_VALUE=$(echo "$ALL_INHERITED_SECRETS" | jq -r --arg key "$SECRET_NAME" '.[$key] // empty')
            if [ -z "$SECRET_VALUE" ]; then
              echo "ERROR: Required inherited secret not found: $SECRET_NAME"
              exit 1
            fi

            DELIMITER=$(uuidgen)
            {
              printf '%s<<%s\n' "$SECRET_NAME" "$DELIMITER"
              printf '%s\n' "$SECRET_VALUE"
              printf '%s\n' "$DELIMITER"
            } >> "$GITHUB_ENV"
          done <<< "$SECRET_NAMES"

      - name: Add workflow-managed OCI annotations to the build
        env:
          MANAGED_ANNOTATIONS: ${{ needs.prepare.outputs.managed_annotations_json }}
        run: |
          # These are appended after the Bake-file annotations, so BuildKit uses
          # these values for the four centrally managed keys. Other annotations
          # remain owned by the calling repository.
          ANNOTATION_ARGS=""
          while IFS='=' read -r key value; do
            ANNOTATION_ARGS="${ANNOTATION_ARGS}${{ matrix.target }}.annotations=${key}=${value}"$'\n'
          done < <(echo "$MANAGED_ANNOTATIONS" | jq -r 'to_entries[] | "\(.key)=\(.value)"')
          
          echo "ANNOTATION_ARGS<<EOF" >> $GITHUB_ENV
          echo "$ANNOTATION_ARGS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build
        id: bake
        env:
          VERSION: ${{ inputs.version }}
        uses: docker/bake-action@v6
        with:
          files: ${{ inputs.bake-file }}
          targets: ${{ matrix.target }}
          set: |
            *.platform=${{ matrix.platform }}
            *.output=type=image,push=true
            ${{ env.ANNOTATION_ARGS }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          # Extract containerimage.digest for this target from bake metadata
          DIGEST=$(echo '${{ steps.bake.outputs.metadata }}' | \
            jq -r --arg target '${{ matrix.target }}' \
            '.[$target]["containerimage.digest"] // empty' | \
            sed 's/^sha256://')
          if [ -z "$DIGEST" ]; then
            echo "ERROR: No digest found for target=${{ matrix.target }} platform=${{ matrix.platform }}"
            echo "Raw metadata:"
            echo '${{ steps.bake.outputs.metadata }}' | jq .
            exit 1
          fi
          echo "$DIGEST" > ${{ runner.temp }}/digests/digest.txt
          echo "Exported digest for ${{ matrix.target }}/${{ matrix.platform }}: $DIGEST"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ needs.prepare.outputs.instance_id }}-${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: ${{ needs.prepare.outputs.needs_merge == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
          pattern: digests-${{ needs.prepare.outputs.instance_id }}-*
          merge-multiple: false

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install regctl
        run: |
          # Install regctl for manifest manipulation
          mkdir -p /tmp/regctl-install
          cd /tmp/regctl-install
          curl -L https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 -o regctl
          chmod +x regctl
          sudo mv regctl /usr/local/bin/

      - name: Create OCI indexes with annotations
        run: |
          # Parse the targets info JSON
          TARGETS_INFO='${{ needs.prepare.outputs.targets_json }}'
          
          echo "=== Targets Info ==="
          echo "$TARGETS_INFO" | jq .
          
          # Get all target names
          TARGETS=$(echo "$TARGETS_INFO" | jq -r 'keys[]')
          
          # Process each target
          for TARGET in $TARGETS; do
            echo ""
            echo "=== Processing target: $TARGET ==="
            
            # Get tags for this target
            TAGS=$(echo "$TARGETS_INFO" | jq -r --arg target "$TARGET" '.[$target].tags[]')
            
            # Get platforms for this target
            PLATFORMS=$(echo "$TARGETS_INFO" | jq -r --arg target "$TARGET" '.[$target].platforms[]')
            
            # Count platforms to determine if we need multi-platform manifest
            PLATFORM_COUNT=$(echo "$PLATFORMS" | wc -l)
            
            echo "Tags for $TARGET:"
            echo "$TAGS"
            echo "Platforms: $PLATFORM_COUNT"
            
            # Report the platform manifests that the build jobs pushed.
            for PLATFORM in $PLATFORMS; do
              PLATFORM_PAIR="${PLATFORM//\//-}"
              DIGEST_FILE="${{ runner.temp }}/artifacts/digests-${{ needs.prepare.outputs.instance_id }}-${TARGET}-${PLATFORM_PAIR}/digest.txt"
              
              if [ -f "$DIGEST_FILE" ]; then
                DIGEST=$(cat "$DIGEST_FILE" | tr -d '\n\r')
                if [ ${#DIGEST} -eq 64 ]; then
                  echo "  Found digest for $PLATFORM: $DIGEST"
                else
                  echo "  Warning: Invalid digest in $DIGEST_FILE"
                fi
              else
                echo "  Warning: Digest file not found: $DIGEST_FILE"
              fi
            done
            
            # Buildx derives the platform metadata for each descriptor. regctl
            # then adds annotations to the OCI Index and every descriptor.
            if [ $PLATFORM_COUNT -gt 1 ]; then
              for TAG in $TAGS; do
                echo ""
                echo "Creating OCI index for: $TAG"
                ANNOTATIONS=$(echo "$TARGETS_INFO" | jq -c --arg target "$TARGET" '.[$target].annotations')
                TAG_SOURCES=()
                FOUND_DIGESTS=0
                for PLATFORM in $PLATFORMS; do
                  PLATFORM_PAIR="${PLATFORM//\//-}"
                  DIGEST_FILE="${{ runner.temp }}/artifacts/digests-${{ needs.prepare.outputs.instance_id }}-${TARGET}-${PLATFORM_PAIR}/digest.txt"
                  if [ -f "$DIGEST_FILE" ]; then
                    DIGEST=$(cat "$DIGEST_FILE" | tr -d '\n\r')
                    TAG_SOURCES+=("$TAG@sha256:$DIGEST")
                    FOUND_DIGESTS=$((FOUND_DIGESTS + 1))
                  fi
                done
                if [ "$FOUND_DIGESTS" -ne "$PLATFORM_COUNT" ]; then
                  echo "ERROR: Expected $PLATFORM_COUNT platform digests for $TARGET, found $FOUND_DIGESTS"
                  exit 1
                fi
                docker buildx imagetools create --prefer-index=true -t "$TAG" "${TAG_SOURCES[@]}"

                INDEX=$(regctl manifest get "$TAG" --format raw-body)
                echo "$INDEX" | jq --argjson annotations "$ANNOTATIONS" \
                  '.annotations = $annotations | .manifests |= map(.annotations = $annotations)' \
                  | regctl manifest put "$TAG"
              done
            else
              # Single platform: image already pushed during build, manifest not needed.
              # Inspect step below will still verify it.
              echo "Single platform build - images already pushed during build step"
              for TAG in $TAGS; do
                echo "  ✓ Image available: $TAG"
              done
            fi
          done

  verify:
    if: ${{ always() && needs.prepare.result == 'success' && needs.build.result == 'success' && (needs.merge.result == 'success' || needs.merge.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
      - merge
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Install regctl
        run: |
          mkdir -p /tmp/regctl-install
          curl -L https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 -o /tmp/regctl-install/regctl
          chmod +x /tmp/regctl-install/regctl
          sudo mv /tmp/regctl-install/regctl /usr/local/bin/regctl

      - name: Verify OCI annotations at every applicable level
        run: |
          TARGETS_INFO='${{ needs.prepare.outputs.targets_json }}'
          TARGETS=$(echo "$TARGETS_INFO" | jq -r 'keys[]')
          
          for TARGET in $TARGETS; do
            echo ""
            echo "=== Inspecting images for target: $TARGET ==="
            
            TAGS=$(echo "$TARGETS_INFO" | jq -r --arg target "$TARGET" '.[$target].tags[]')
            PLATFORMS=$(echo "$TARGETS_INFO" | jq -r --arg target "$TARGET" '.[$target].platforms[]')
            PLATFORM_COUNT=$(echo "$PLATFORMS" | wc -l)
            
            for TAG in $TAGS; do
              echo ""
              echo "Image: $TAG"
              
              EXPECTED=$(echo "$TARGETS_INFO" | jq -c --arg target "$TARGET" '.[$target].annotations')
              verify_annotations() {
                local level="$1"
                local manifest="$2"
                echo "  Verifying $level"
                echo "$manifest" | jq -e --argjson expected "$EXPECTED" '
                  (.annotations // {}) as $actual
                  | all($expected | to_entries[]; $actual[.key] == .value)' > /dev/null
              }

              if [ "$PLATFORM_COUNT" -gt 1 ]; then
                INDEX=$(regctl manifest get "$TAG" --format raw-body)
                verify_annotations "OCI index" "$INDEX"
                while IFS= read -r DESCRIPTOR; do
                  DESCRIPTOR_PLATFORM=$(echo "$DESCRIPTOR" | jq -r '
                    if .platform then (.platform.os + "/" + .platform.architecture) else "unspecified" end')
                  verify_annotations "descriptor for $DESCRIPTOR_PLATFORM" "$DESCRIPTOR"
                done < <(echo "$INDEX" | jq -c '.manifests[]')
                for PLATFORM in $PLATFORMS; do
                  IMAGE_MANIFEST=$(regctl manifest get "$TAG" --platform="$PLATFORM" --format raw-body)
                  verify_annotations "image manifest for $PLATFORM" "$IMAGE_MANIFEST"
                done
              else
                PLATFORM=$(echo "$PLATFORMS" | head -n 1)
                IMAGE_MANIFEST=$(regctl manifest get "$TAG" --platform="$PLATFORM" --format raw-body)
                verify_annotations "single-architecture image manifest" "$IMAGE_MANIFEST"
              fi
            done
          done
