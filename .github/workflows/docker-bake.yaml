name: docker-bake

on:
  workflow_call:
    inputs:
      bake-file:
        description: 'Bake HCL file path'
        type: string
        default: './docker-bake.hcl'
      group:
        description: 'Bake group to build'
        type: string
        default: 'default'
      version:
        description: 'Version string to expose as VERSION env var for bake variable interpolation (e.g. for tagging from a release)'
        type: string
        required: false
      runner-amd64:
        description: 'Runner to use for amd64 builds'
        type: string
        default: 'ubuntu-latest'
      runner-arm64:
        description: 'Runner to use for arm64 builds'
        type: string
        default: 'ubuntu-24.04-arm'
      fail-on-scan-findings:
        description: 'Fail the workflow at the end if Trivy reports findings'
        type: boolean
        default: true
      trivyignore-file:
        description: 'Path to the Trivy ignore file in the calling repository'
        type: string
        default: '.trivyignore'
    secrets:
      dockerhub_username:
        description: 'DockerHub username'
        required: true
      dockerhub_token:
        description: 'DockerHub token'
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      targets_json: ${{ steps.parse.outputs.targets_json }}
      instance_id: ${{ steps.parse.outputs.instance_id }}
      managed_annotations_json: ${{ steps.annotations.outputs.annotations_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute OCI annotations
        id: annotations
        env:
          GH_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          IMAGE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # Compute the 4 standard OCI annotations from GitHub context
          CREATED_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          ANNOTATIONS=$(jq -cn \
            --arg created "$CREATED_TIME" \
            --arg source "$GH_REPO_URL" \
            --arg version "$IMAGE_VERSION" \
            --arg revision "$GH_SHA" \
            '{"org.opencontainers.image.created": $created,
              "org.opencontainers.image.source": $source,
              "org.opencontainers.image.version": $version,
              "org.opencontainers.image.revision": $revision}')
          
          echo "annotations_json=$(echo "$ANNOTATIONS" | jq -c .)" >> $GITHUB_OUTPUT
          
          echo "=== OCI Annotations (workflow-managed) ==="
          echo "$ANNOTATIONS" | jq .

      - name: Parse bake file and build matrix and target info
        id: parse
        env:
          VERSION: ${{ inputs.version }}
          MANAGED_ANNOTATIONS: ${{ steps.annotations.outputs.annotations_json }}
        run: |
          # Unique ID to namespace artifacts when multiple caller jobs invoke this workflow in one run
          INSTANCE_ID=$(head -c 4 /dev/urandom | xxd -p)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

          BAKE_JSON=$(docker buildx bake --file ${{ inputs.bake-file }} --print ${{ inputs.group }})
          TARGET_NAMES=$(echo "$BAKE_JSON" | jq -r --arg group '${{ inputs.group }}' '.group[$group].targets[]')

          MATRIX_ITEMS='[]'
          TARGETS_INFO='{}'

          for TARGET in $TARGET_NAMES; do
            PLATFORMS=$(echo "$BAKE_JSON" | jq -r --arg target "$TARGET" '.target[$target].platforms[]?')

            if [ -z "$PLATFORMS" ]; then
              echo "Warning: Target $TARGET has no platforms, skipping"
              continue
            fi

            # Build matrix entries for this target
            for PLATFORM in $PLATFORMS; do
              MATRIX_ITEMS=$(echo "$MATRIX_ITEMS" | jq -c --arg target "$TARGET" --arg platform "$PLATFORM" \
                '. += [{"target": $target, "platform": $platform}]')
            done

            # Build targets info entry for this target
            TAGS=$(echo "$BAKE_JSON" | jq -c --arg target "$TARGET" \
              '[.target[$target].tags[]? | select(test("^[a-zA-Z0-9-._/]+@[a-f0-9]{64}$") | not)]')
            PLATFORMS_JSON=$(echo "$BAKE_JSON" | jq -c --arg target "$TARGET" \
              '[.target[$target].platforms[]?]')
            # Bake uses key=value strings for annotations. Preserve every caller
            # annotation, then overwrite only the workflow-managed OCI keys.
            CALLER_ANNOTATIONS=$(echo "$BAKE_JSON" | jq -c --arg target "$TARGET" '
              [.target[$target].annotations[]? | capture("^(?<key>[^=]+)=(?<value>.*)$")]
              | reduce .[] as $annotation ({}; .[$annotation.key] = $annotation.value)')
            EFFECTIVE_ANNOTATIONS=$(jq -cn \
              --argjson caller "$CALLER_ANNOTATIONS" \
              --argjson managed "$MANAGED_ANNOTATIONS" \
              '$caller + $managed')
            TARGETS_INFO=$(echo "$TARGETS_INFO" | jq -c \
              --arg target "$TARGET" \
              --argjson tags "$TAGS" \
              --argjson platforms "$PLATFORMS_JSON" \
              --argjson annotations "$EFFECTIVE_ANNOTATIONS" \
              '.[$target] = {"tags": $tags, "platforms": $platforms, "annotations": $annotations}')
          done

          echo "matrix=$MATRIX_ITEMS" >> $GITHUB_OUTPUT
          echo "targets_json=$TARGETS_INFO" >> $GITHUB_OUTPUT

          echo "=== Build Matrix ==="
          echo "$MATRIX_ITEMS" | jq .
          echo "=== Targets Info ==="
          echo "$TARGETS_INFO" | jq .

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && inputs.runner-arm64 || inputs.runner-amd64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Discover and export inherited build secrets
        env:
          ALL_INHERITED_SECRETS: ${{ toJSON(secrets) }}
          BAKE_FILE: ${{ inputs.bake-file }}
          BAKE_GROUP: ${{ inputs.group }}
        run: |
          set -euo pipefail

          BAKE_JSON=$(docker buildx bake --file "$BAKE_FILE" --print "$BAKE_GROUP")

          BAD_SECRET_NAMES=$(echo "$BAKE_JSON" | jq -r '
            .target
            | to_entries[]
            | .value.secret[]?
            | select(type == "object")
            | select((.id // empty) != "" and (.env // empty) != "" and (.id != .env))
            | "id=\(.id) env=\(.env)"' || true)

          if [ -n "$BAD_SECRET_NAMES" ]; then
            echo "ERROR: Every bake secret id must match its env name. Found mismatches:"
            printf '%s\n' "$BAD_SECRET_NAMES"
            exit 1
          fi

          SECRET_NAMES=$(echo "$BAKE_JSON" | jq -r '
            .target
            | to_entries[]
            | .value.secret[]?
            | if type == "object" then (.id // .env // empty) else . end
            | select(length > 0)
          ' | sort -u)

          if [ -z "$SECRET_NAMES" ]; then
            echo "No build secrets referenced by the bake file for group $BAKE_GROUP."
            exit 0
          fi

          while IFS= read -r SECRET_NAME; do
            [ -n "$SECRET_NAME" ] || continue

            SECRET_VALUE=$(echo "$ALL_INHERITED_SECRETS" | jq -r --arg key "$SECRET_NAME" '.[$key] // empty')
            if [ -z "$SECRET_VALUE" ]; then
              echo "ERROR: Required inherited secret not found: $SECRET_NAME"
              exit 1
            fi

            DELIMITER=$(uuidgen)
            {
              printf '%s<<%s\n' "$SECRET_NAME" "$DELIMITER"
              printf '%s\n' "$SECRET_VALUE"
              printf '%s\n' "$DELIMITER"
            } >> "$GITHUB_ENV"
          done <<< "$SECRET_NAMES"

      - name: Add workflow-managed OCI annotations to the build
        env:
          MANAGED_ANNOTATIONS: ${{ needs.prepare.outputs.managed_annotations_json }}
        run: |
          # These are appended after the Bake-file annotations, so BuildKit uses
          # these values for the four centrally managed keys. Other annotations
          # remain owned by the calling repository.
          ANNOTATION_ARGS=""
          while IFS='=' read -r key value; do
            ANNOTATION_ARGS="${ANNOTATION_ARGS}${{ matrix.target }}.annotations=${key}=${value}"$'\n'
          done < <(echo "$MANAGED_ANNOTATIONS" | jq -r 'to_entries[] | "\(.key)=\(.value)"')
          
          echo "ANNOTATION_ARGS<<EOF" >> $GITHUB_ENV
          echo "$ANNOTATION_ARGS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build
        id: bake
        env:
          VERSION: ${{ inputs.version }}
        uses: docker/bake-action@v6
        with:
          files: ${{ inputs.bake-file }}
          targets: ${{ matrix.target }}
          set: |
            *.platform=${{ matrix.platform }}
            *.output=type=image,push=true
            ${{ env.ANNOTATION_ARGS }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          # Extract containerimage.digest for this target from bake metadata
          DIGEST=$(echo '${{ steps.bake.outputs.metadata }}' | \
            jq -r --arg target '${{ matrix.target }}' \
            '.[$target]["containerimage.digest"] // empty' | \
            sed 's/^sha256://')
          if [ -z "$DIGEST" ]; then
            echo "ERROR: No digest found for target=${{ matrix.target }} platform=${{ matrix.platform }}"
            echo "Raw metadata:"
            echo '${{ steps.bake.outputs.metadata }}' | jq .
            exit 1
          fi
          echo "$DIGEST" > ${{ runner.temp }}/digests/digest.txt
          echo "Exported digest for ${{ matrix.target }}/${{ matrix.platform }}: $DIGEST"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ needs.prepare.outputs.instance_id }}-${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
          pattern: digests-${{ needs.prepare.outputs.instance_id }}-*
          merge-multiple: false

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install regctl
        run: |
          mkdir -p /tmp/regctl-install
          cd /tmp/regctl-install
          curl -L https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 -o regctl
          chmod +x regctl
          sudo mv regctl /usr/local/bin/

      - name: Create OCI indexes with annotations
        run: |
          TARGETS_INFO='${{ needs.prepare.outputs.targets_json }}'
          
          echo "=== Targets Info ==="
          echo "$TARGETS_INFO" | jq .
          
          TARGETS=$(echo "$TARGETS_INFO" | jq -r 'keys[]')
          
          for TARGET in $TARGETS; do
            echo ""
            echo "=== Processing target: $TARGET ==="
            
            TAGS=$(echo "$TARGETS_INFO" | jq -r --arg target "$TARGET" '.[$target].tags[]')
            PLATFORMS=$(echo "$TARGETS_INFO" | jq -r --arg target "$TARGET" '.[$target].platforms[]')
            ANNOTATIONS=$(echo "$TARGETS_INFO" | jq -c --arg target "$TARGET" '.[$target].annotations')
            
            for TAG in $TAGS; do
              echo ""
              echo "Creating and annotating OCI index for: $TAG"
              
              REPO=$(echo "$TAG" | sed 's/@[^@]*$//; s/:[^:]*$//')
              
              TAG_SOURCES=()
              for PLATFORM in $PLATFORMS; do
                PLATFORM_PAIR="${PLATFORM//\//-}"
                DIGEST_FILE="${{ runner.temp }}/artifacts/digests-${{ needs.prepare.outputs.instance_id }}-${TARGET}-${PLATFORM_PAIR}/digest.txt"
                if [ ! -f "$DIGEST_FILE" ]; then
                  echo "ERROR: Digest file not found: $DIGEST_FILE"
                  exit 1
                fi
                DIGEST=$(cat "$DIGEST_FILE" | tr -d '\n\r')
                TAG_SOURCES+=("$REPO@sha256:$DIGEST")
              done
              
              # Create initial OCI index pointing to platform images.
              # --prefer-index=true guarantees an index is created for single-platform targets as well as multi-platform.
              docker buildx imagetools create --prefer-index=true -t "$TAG" "${TAG_SOURCES[@]}"
              
              # Ordering Rule:
              # 1. Mutate and push each Level 3 platform Image Manifest by digest (regctl manifest put --by-digest "$REPO") first.
              # 2. Update OCI Index (Level 1 .annotations) and platform descriptors (Level 2 .digest, .size, .annotations).
              # 3. Push updated OCI Index to $TAG (regctl manifest put "$TAG").
              
              INDEX=$(regctl manifest get "$TAG" --format raw-body)
              UPDATED_MANIFESTS='[]'
              
              while IFS= read -r DESCRIPTOR; do
                DIGEST=$(echo "$DESCRIPTOR" | jq -r '.digest')
                MEDIA_TYPE=$(echo "$DESCRIPTOR" | jq -r '.mediaType // empty')
                PLATFORM_OS=$(echo "$DESCRIPTOR" | jq -r '.platform.os // empty')
                
                if [[ "$MEDIA_TYPE" == *"manifest"* && "$PLATFORM_OS" != "" && "$PLATFORM_OS" != "unknown" ]]; then
                  echo "  Mutating Level 3 manifest for $DIGEST ($PLATFORM_OS)..."
                  MANIFEST=$(regctl manifest get "$REPO@$DIGEST" --format raw-body)
                  MUTATED=$(echo "$MANIFEST" | jq --argjson annos "$ANNOTATIONS" '.annotations = $annos')
                  
                  NEW_DIGEST="sha256:$(printf '%s' "$MUTATED" | sha256sum | awk '{print $1}')"
                  NEW_SIZE=$(printf '%s' "$MUTATED" | wc -c)
                  
                  # 1. Mutate and push Level 3 platform Image Manifest by digest first
                  echo "  Pushing Level 3 manifest to $REPO by digest: $NEW_DIGEST (size: $NEW_SIZE)"
                  printf '%s' "$MUTATED" | regctl manifest put "$REPO" --by-digest
                  
                  # 2. Update Level 2 descriptor with new digest, size, and annotations
                  UPDATED_DESCRIPTOR=$(echo "$DESCRIPTOR" | jq \
                    --arg d "$NEW_DIGEST" \
                    --argjson s "$NEW_SIZE" \
                    --argjson annos "$ANNOTATIONS" \
                    '.digest = $d | .size = $s | .annotations = $annos')
                  UPDATED_MANIFESTS=$(echo "$UPDATED_MANIFESTS" | jq --argjson d "$UPDATED_DESCRIPTOR" '. += [$d]')
                else
                  # Keep non-platform descriptors (attestations, etc.) as is
                  UPDATED_MANIFESTS=$(echo "$UPDATED_MANIFESTS" | jq --argjson d "$DESCRIPTOR" '. += [$d]')
                fi
              done < <(echo "$INDEX" | jq -c '.manifests[]')
              
              # 2 (cont). Update Level 1 OCI Index
              OCI_INDEX=$(echo "$INDEX" | jq \
                --argjson annos "$ANNOTATIONS" \
                --argjson manifests "$UPDATED_MANIFESTS" \
                '.annotations = $annos | .manifests = $manifests')
              
              # 3. Push updated OCI Index to $TAG
              echo "  Pushing updated OCI Index to $TAG..."
              for ATTEMPT in 1 2 3; do
                if printf '%s' "$OCI_INDEX" | regctl manifest put "$TAG"; then
                  echo "  ✓ Successfully pushed annotated OCI Index for $TAG"
                  break
                fi
                if [ "$ATTEMPT" -eq 3 ]; then
                  echo "ERROR: Failed to push annotated OCI Index for $TAG after 3 attempts"
                  exit 1
                fi
                sleep $((ATTEMPT * 2))
              done
            done
          done

  scan:
    needs:
      - prepare
      - merge
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    # Match the image architecture in case a future scanner step needs native execution.
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && inputs.runner-arm64 || inputs.runner-amd64 }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Prepare scan variables
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Install oras and regctl
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) ARCH=amd64 ;;
            aarch64) ARCH=arm64 ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          ORAS_VERSION=1.3.0
          ORAS_ARCHIVE="$RUNNER_TEMP/oras_${ORAS_VERSION}_linux_${ARCH}.tar.gz"
          curl -fL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_${ARCH}.tar.gz" \
            -o "$ORAS_ARCHIVE"
          tar -xzf "$ORAS_ARCHIVE" -C /usr/local/bin oras

          curl -fL "https://github.com/regclient/regclient/releases/latest/download/regctl-linux-${ARCH}" \
            -o "$RUNNER_TEMP/regctl"
          chmod +x "$RUNNER_TEMP/regctl"
          sudo mv "$RUNNER_TEMP/regctl" /usr/local/bin/regctl

      - name: Scan platform image and create attestation
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          TARGETS_JSON: ${{ needs.prepare.outputs.targets_json }}
          TRIVY_IGNORE_FILE: ${{ inputs.trivyignore-file }}
        run: |
          set -euo pipefail

          TAG=$(echo "$TARGETS_JSON" | jq -r --arg target "$TARGET" '.[$target].tags[0]')
          REPO="${TAG%:*}"
          PLATFORM_DIGEST=$(regctl manifest get "$TAG" \
            --platform "$PLATFORM" --format '{{.GetDescriptor.Digest}}')

          TRIVY_ARGS=(
            image
            --scanners vuln,secret,misconfig
            --format json
            --exit-code 0
            --output trivy-results.json
          )
          if [ -f "$TRIVY_IGNORE_FILE" ]; then
            echo "Using Trivy ignore file: $TRIVY_IGNORE_FILE"
            TRIVY_ARGS+=(--ignorefile "$TRIVY_IGNORE_FILE")
          else
            echo "No Trivy ignore file at $TRIVY_IGNORE_FILE; proceeding without it"
          fi

          trivy "${TRIVY_ARGS[@]}" "$REPO@$PLATFORM_DIGEST"
          jq '{scanner: {name: "Trivy", result: {Results: (.Results // [])}}}' \
            trivy-results.json > vuln-predicate.json

          HAS_FINDINGS=$(jq \
            '[.scanner.result.Results[]? |
              (.Vulnerabilities[]?, .Secrets[]?, .Misconfigurations[]?)] | length > 0' \
            vuln-predicate.json)
          echo "has_findings=$HAS_FINDINGS" > findings-status.txt

          DIGEST_HASH="${PLATFORM_DIGEST#sha256:}"
          jq -n \
            --arg type "https://in-toto.io/Statement/v1" \
            --arg predType "https://aquasecurity.github.io/trivy/attestation/scan/v1" \
            --arg name "$REPO" \
            --arg digest "$DIGEST_HASH" \
            --slurpfile predicate vuln-predicate.json \
            '{
              "_type": $type,
              "subject": [{"name": $name, "digest": {"sha256": $digest}}],
              "predicateType": $predType,
              "predicate": $predicate[0]
            }' > statement.json

          oras attach \
            --distribution-spec v1.1-referrers-tag \
            --artifact-type "application/vnd.in-toto+json" \
            --annotation "in-toto.io/predicate-type=https://aquasecurity.github.io/trivy/attestation/scan/v1" \
            "$REPO@$PLATFORM_DIGEST" \
            statement.json:application/vnd.in-toto+json

      - name: Upload scan findings
        uses: actions/upload-artifact@v4
        with:
          name: scan-findings-${{ needs.prepare.outputs.instance_id }}-${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          path: |
            findings-status.txt
            vuln-predicate.json
          if-no-files-found: error
          retention-days: 1

  scan-summary:
    needs:
      - prepare
      - scan
    runs-on: ubuntu-latest
    outputs:
      has_findings: ${{ steps.aggregate.outputs.has_findings }}
    steps:
      - name: Download scan findings
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/scan-findings
          pattern: scan-findings-${{ needs.prepare.outputs.instance_id }}-*
          merge-multiple: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Install oras and regctl
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) ARCH=amd64 ;;
            aarch64) ARCH=arm64 ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          ORAS_VERSION=1.3.0
          ORAS_ARCHIVE="$RUNNER_TEMP/oras_${ORAS_VERSION}_linux_${ARCH}.tar.gz"
          curl -fL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_${ARCH}.tar.gz" \
            -o "$ORAS_ARCHIVE"
          tar -xzf "$ORAS_ARCHIVE" -C /usr/local/bin oras

          curl -fL "https://github.com/regclient/regclient/releases/latest/download/regctl-linux-${ARCH}" \
            -o "$RUNNER_TEMP/regctl"
          chmod +x "$RUNNER_TEMP/regctl"
          sudo mv "$RUNNER_TEMP/regctl" /usr/local/bin/regctl

      - name: Aggregate findings and attest OCI indexes
        id: aggregate
        env:
          TARGETS_JSON: ${{ needs.prepare.outputs.targets_json }}
          INSTANCE_ID: ${{ needs.prepare.outputs.instance_id }}
          SCAN_FINDINGS_DIR: ${{ runner.temp }}/scan-findings
        run: |
          set -euo pipefail

          TARGETS=$(echo "$TARGETS_JSON" | jq -r 'keys[]')
          SUMMARY_JSON='{"targets":[],"totals":{"vulnerabilitiesBySeverity":{},"totalVulnerabilities":0,"secrets":0,"misconfigurations":0}}'
          HAS_FINDINGS=false

          for TARGET in $TARGETS; do
            TARGET_SUMMARY='{"platforms":[],"totals":{"vulnerabilitiesBySeverity":{},"totalVulnerabilities":0,"secrets":0,"misconfigurations":0}}'
            PLATFORMS=$(echo "$TARGETS_JSON" | jq -r --arg target "$TARGET" '.[$target].platforms[]')

            for PLATFORM in $PLATFORMS; do
              PLATFORM_PAIR="${PLATFORM//\//-}"
              ARTIFACT_DIR="$SCAN_FINDINGS_DIR/scan-findings-${INSTANCE_ID}-${TARGET}-${PLATFORM_PAIR}"
              PREDICATE="$ARTIFACT_DIR/vuln-predicate.json"
              STATUS_FILE="$ARTIFACT_DIR/findings-status.txt"

              if [ ! -f "$PREDICATE" ] || [ ! -f "$STATUS_FILE" ]; then
                echo "ERROR: Scan findings missing for $TARGET/$PLATFORM"
                exit 1
              fi
              if grep -q '^has_findings=true$' "$STATUS_FILE"; then
                HAS_FINDINGS=true
              fi

              COUNTS=$(jq -c '{
                vulnerabilitiesBySeverity: ([.scanner.result.Results[]?.Vulnerabilities[]?]
                  | group_by(.Severity)
                  | map({(.[0].Severity): length}) | add // {}),
                totalVulnerabilities: ([.scanner.result.Results[]?.Vulnerabilities[]?] | length),
                secrets: ([.scanner.result.Results[]?.Secrets[]?] | length),
                misconfigurations: ([.scanner.result.Results[]?.Misconfigurations[]?] | length)
              }' "$PREDICATE")
              TARGET_SUMMARY=$(echo "$TARGET_SUMMARY" | jq -c \
                --arg platform "$PLATFORM" --argjson counts "$COUNTS" '
                .platforms += [$counts + {platform: $platform}]
                | .totals.vulnerabilitiesBySeverity |=
                    reduce ($counts.vulnerabilitiesBySeverity | to_entries[]) as $severity
                      (. ; .[$severity.key] = ((.[$severity.key] // 0) + $severity.value))
                | .totals.totalVulnerabilities += $counts.totalVulnerabilities
                | .totals.secrets += $counts.secrets
                | .totals.misconfigurations += $counts.misconfigurations')
            done

            TARGET_SUMMARY=$(echo "$TARGET_SUMMARY" | jq -c --arg target "$TARGET" '. + {target: $target}')
            SUMMARY_JSON=$(echo "$SUMMARY_JSON" | jq -c --argjson target_summary "$TARGET_SUMMARY" '
              .targets += [$target_summary]
              | .totals.totalVulnerabilities += $target_summary.totals.totalVulnerabilities
              | .totals.secrets += $target_summary.totals.secrets
              | .totals.misconfigurations += $target_summary.totals.misconfigurations
              | .totals.vulnerabilitiesBySeverity |=
                  reduce ($target_summary.totals.vulnerabilitiesBySeverity | to_entries[]) as $severity
                    (. ; .[$severity.key] = ((.[$severity.key] // 0) + $severity.value))')
          done

          echo "has_findings=$HAS_FINDINGS" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY_JSON" | jq .

          for TARGET in $TARGETS; do
            TARGET_SUMMARY=$(echo "$SUMMARY_JSON" | jq -c --arg target "$TARGET" \
              '.targets[] | select(.target == $target)')
            TAGS=$(echo "$TARGETS_JSON" | jq -r --arg target "$TARGET" '.[$target].tags[]')

            for TAG in $TAGS; do
              REPO="${TAG%:*}"
              INDEX_DIGEST=$(regctl manifest get "$TAG" --format '{{.GetDescriptor.Digest}}')
              DIGEST_HASH="${INDEX_DIGEST#sha256:}"
              jq -n \
                --arg type "https://in-toto.io/Statement/v1" \
                --arg predType "https://aquasecurity.github.io/trivy/attestation/scan-summary/v1" \
                --arg name "$REPO" \
                --arg digest "$DIGEST_HASH" \
                --argjson summary "$TARGET_SUMMARY" \
                '{
                  "_type": $type,
                  "subject": [{"name": $name, "digest": {"sha256": $digest}}],
                  "predicateType": $predType,
                  "predicate": $summary
                }' > index-statement.json

              oras attach \
                --distribution-spec v1.1-referrers-tag \
                --artifact-type "application/vnd.in-toto+json" \
                --annotation "in-toto.io/predicate-type=https://aquasecurity.github.io/trivy/attestation/scan-summary/v1" \
                --annotation "scan-level=index-summary" \
                "$REPO@$INDEX_DIGEST" \
                index-statement.json:application/vnd.in-toto+json
            done
          done

  verify:
    if: ${{ always() && needs.prepare.result == 'success' && needs.build.result == 'success' && needs.merge.result == 'success' && needs.scan-summary.result == 'success' }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
      - merge
      - scan-summary
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Install regctl
        run: |
          mkdir -p /tmp/regctl-install
          curl -L https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 -o /tmp/regctl-install/regctl
          chmod +x /tmp/regctl-install/regctl
          sudo mv /tmp/regctl-install/regctl /usr/local/bin/regctl

      - name: Install oras
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) ARCH=amd64 ;;
            aarch64) ARCH=arm64 ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          ORAS_VERSION=1.3.0
          ORAS_ARCHIVE="$RUNNER_TEMP/oras_${ORAS_VERSION}_linux_${ARCH}.tar.gz"
          curl -fL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_${ARCH}.tar.gz" \
            -o "$ORAS_ARCHIVE"
          tar -xzf "$ORAS_ARCHIVE" -C /usr/local/bin oras

      - name: Verify OCI annotations at all 3 levels (Index, Descriptors, Image Manifests)
        run: |
          TARGETS_INFO='${{ needs.prepare.outputs.targets_json }}'
          TARGETS=$(echo "$TARGETS_INFO" | jq -r 'keys[]')
          
          for TARGET in $TARGETS; do
            echo ""
            echo "=== Inspecting images for target: $TARGET ==="
            
            TAGS=$(echo "$TARGETS_INFO" | jq -r --arg target "$TARGET" '.[$target].tags[]')
            PLATFORMS=$(echo "$TARGETS_INFO" | jq -r --arg target "$TARGET" '.[$target].platforms[]')
            EXPECTED=$(echo "$TARGETS_INFO" | jq -c --arg target "$TARGET" '.[$target].annotations')
            
            for TAG in $TAGS; do
              echo ""
              echo "Image: $TAG"
              REPO="${TAG%:*}"
              
              verify_annotations() {
                local level="$1"
                local json_data="$2"
                echo "  Verifying $level"
                
                MISMATCH=$(echo "$json_data" | jq -c --argjson expected "$EXPECTED" '
                  (.annotations // {}) as $actual
                  | [($expected | to_entries[]) | select($actual[.key] != .value)]')
                
                if [ "$MISMATCH" != "[]" ]; then
                  echo "ERROR: Annotation mismatch at $level for $TAG!"
                  echo "Expected annotations:"
                  echo "$EXPECTED" | jq .
                  echo "Actual annotations found:"
                  echo "$json_data" | jq '.annotations // {}'
                  echo "Mismatches:"
                  echo "$MISMATCH" | jq .
                  exit 1
                fi
                echo "    ✓ Pass"
              }

              # Level 1: Fetch raw OCI Index
              INDEX=$(regctl manifest get "$TAG" --format raw-body)
              MEDIA_TYPE=$(echo "$INDEX" | jq -r '.mediaType // empty')
              if [[ "$MEDIA_TYPE" != *"index"* && "$MEDIA_TYPE" != *"manifest.list"* ]]; then
                echo "ERROR: Image $TAG is not an OCI Index / Manifest List! Media type: $MEDIA_TYPE"
                exit 1
              fi
              verify_annotations "Level 1 (OCI Index)" "$INDEX"
              
              # Level 2: Descriptors
              while IFS= read -r DESCRIPTOR; do
                DESCRIPTOR_PLATFORM=$(echo "$DESCRIPTOR" | jq -r '
                  if .platform and .platform.os != "unknown" then (.platform.os + "/" + .platform.architecture + (if .platform.variant then "/" + .platform.variant else "" end)) else "attestation" end')
                
                if [ "$DESCRIPTOR_PLATFORM" != "attestation" ]; then
                  verify_annotations "Level 2 Descriptor for $DESCRIPTOR_PLATFORM" "$DESCRIPTOR"
                fi
              done < <(echo "$INDEX" | jq -c '.manifests[]')
              
              # Level 3: Platform Image Manifests
              for PLATFORM in $PLATFORMS; do
                IMAGE_MANIFEST=$(regctl manifest get "$TAG" --platform="$PLATFORM" --format raw-body)
                verify_annotations "Level 3 Image Manifest for $PLATFORM" "$IMAGE_MANIFEST"

                PLATFORM_DIGEST=$(regctl manifest get "$TAG" \
                  --platform "$PLATFORM" --format '{{.GetDescriptor.Digest}}')
                REFERRERS=$(regctl artifact list "$REPO@$PLATFORM_DIGEST" \
                  --slow-referrers \
                  --filter-artifact-type "application/vnd.in-toto+json" \
                  --format '{{len .Manifest.Manifests}}')
                if [ "$REFERRERS" -lt 1 ]; then
                  echo "ERROR: No scan attestation referrer found for $PLATFORM_DIGEST"
                  exit 1
                fi
                echo "    ✓ Scan attestation referrer found for $PLATFORM"
              done

              INDEX_DIGEST=$(regctl manifest get "$TAG" --format '{{.GetDescriptor.Digest}}')
              REFERRERS=$(regctl artifact list "$REPO@$INDEX_DIGEST" \
                --slow-referrers \
                --filter-artifact-type "application/vnd.in-toto+json" \
                --format '{{len .Manifest.Manifests}}')
              if [ "$REFERRERS" -lt 1 ]; then
                echo "ERROR: No scan summary attestation referrer found for index $INDEX_DIGEST"
                exit 1
              fi
              echo "    ✓ Scan summary attestation referrer found for index"
            done
          done

      - name: Verify scan attestation statements
        env:
          TARGETS_INFO: ${{ needs.prepare.outputs.targets_json }}
        run: |
          set -euo pipefail

          verify_statement() {
            local subject_ref="$1"
            local subject_digest="$2"
            local predicate_type="$3"
            local statement_kind="$4"
            local digest_hash="${subject_digest#sha256:}"
            local subject_ref_repo="${subject_ref%@*}"
            local referrer_digest
            local output_dir
            local statement_file

            referrer_digest=$(oras discover \
              --distribution-spec v1.1-referrers-tag \
              --format json \
              --depth 1 \
              --artifact-type application/vnd.in-toto+json \
              "$subject_ref" \
              | jq -r --arg predicate_type "$predicate_type" \
                  '.referrers[]? | select(.annotations["in-toto.io/predicate-type"] == $predicate_type) | .digest' \
              | sed -n '1p')
            if [ -z "$referrer_digest" ]; then
              echo "ERROR: No $statement_kind attestation discoverable for $subject_ref"
              exit 1
            fi

            output_dir=$(mktemp -d "$RUNNER_TEMP/attestation-${statement_kind}-${digest_hash}-XXXXXX")
            oras pull "$subject_ref_repo@$referrer_digest" --output "$output_dir"
            statement_file=$(find "$output_dir" -type f -name '*.json' -print -quit)
            if [ -z "$statement_file" ]; then
              echo "ERROR: No JSON statement found in $statement_kind attestation $referrer_digest"
              exit 1
            fi

            if [ "$statement_kind" = "platform" ]; then
              jq -e \
                --arg digest "$digest_hash" \
                --arg predicate_type "$predicate_type" \
                '._type == "https://in-toto.io/Statement/v1"
                 and .predicateType == $predicate_type
                 and .subject[0].digest.sha256 == $digest
                 and .predicate.scanner.name == "Trivy"
                 and (.predicate.scanner.result.Results | type == "array")' \
                "$statement_file" >/dev/null
            else
              jq -e \
                --arg digest "$digest_hash" \
                --arg predicate_type "$predicate_type" \
                '._type == "https://in-toto.io/Statement/v1"
                 and .predicateType == $predicate_type
                 and .subject[0].digest.sha256 == $digest
                 and (.predicate.platforms | type == "array")
                 and (.predicate.totals | type == "object")' \
                "$statement_file" >/dev/null
            fi
            echo "    ✓ Valid $statement_kind in-toto scan attestation for $subject_ref"
          }

          TARGETS=$(echo "$TARGETS_INFO" | jq -r 'keys[]')
          for TARGET in $TARGETS; do
            TAGS=$(echo "$TARGETS_INFO" | jq -r --arg target "$TARGET" '.[$target].tags[]')
            PLATFORMS=$(echo "$TARGETS_INFO" | jq -r --arg target "$TARGET" '.[$target].platforms[]')

            for TAG in $TAGS; do
              REPO="${TAG%:*}"
              for PLATFORM in $PLATFORMS; do
                PLATFORM_DIGEST=$(regctl manifest get "$TAG" \
                  --platform "$PLATFORM" --format '{{.GetDescriptor.Digest}}')
                subject_ref="$REPO@$PLATFORM_DIGEST"
                verify_statement "$subject_ref" "$PLATFORM_DIGEST" \
                  "https://aquasecurity.github.io/trivy/attestation/scan/v1" platform
              done

              INDEX_DIGEST=$(regctl manifest get "$TAG" --format '{{.GetDescriptor.Digest}}')
              subject_ref="$REPO@$INDEX_DIGEST"
              verify_statement "$subject_ref" "$INDEX_DIGEST" \
                "https://aquasecurity.github.io/trivy/attestation/scan-summary/v1" index
            done
          done

  gate:
    if: >-
      ${{ always()
          && needs.prepare.result == 'success'
          && needs.build.result == 'success'
          && needs.merge.result == 'success'
          && needs.scan.result == 'success'
          && needs.scan-summary.result == 'success'
          && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
      - merge
      - scan
      - scan-summary
      - verify
    steps:
      - name: Enforce scan findings policy
        env:
          FAIL_ON_SCAN_FINDINGS: ${{ inputs.fail-on-scan-findings }}
          HAS_FINDINGS: ${{ needs.scan-summary.outputs.has_findings }}
        run: |
          if [ "$FAIL_ON_SCAN_FINDINGS" = "true" ] && [ "$HAS_FINDINGS" = "true" ]; then
            echo "::error::Trivy scan findings detected. Failing because fail-on-scan-findings is enabled."
            exit 1
          fi
          echo "No findings or fail-on-scan-findings is disabled. Passing."
